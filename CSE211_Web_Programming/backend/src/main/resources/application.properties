spring.application.name=powerbank-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/powerbank?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
services.ai.base-url=${AI_SERVICE_URL:http://localhost:8001}
services.image-processing.base-url=${IMAGE_PROCESSING_SERVICE_URL:http://localhost:8002}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500}
reservations.expiration-poll-ms=${RESERVATION_EXPIRATION_POLL_MS:30000}
